b{font-size:23px;display:block;color:#213b5c}.stat small{font-size:10px;text-transform:uppercase;letter-spacing:.5px}.listhead{display:flex;align-items:center;justify-content:space-between;margin:0 14px 10px;gap:8px}h2{font-size:18px;margin:0}.chip{font-size:10px;padding:6px 9px;border-radius:20px;background:#dfe9f8;color:#3e5e8e;white-space:nowrap}.list{display:flex;flex-direction:column;gap:8px;padding:0 12px}.flight{width:100%;text-align:left;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff}.flight.selected{border-color:#2563eb;background:#eff6ff}.flight-top,.flight-bottom{display:flex;justify-content:space-between;gap:8px;align-items:center}.flight-top strong{font-size:18px}.flight-top .dist{font:12px ui-monospace,monospace;color:#2563eb}.flight-sub{margin:5px 0 12px;font-size:12px;color:var(--muted)}.flight-bottom{font-size:13px}.flight-bottom span{flex:1}.flight-bottom span:last-child{text-align:right}.state{font-size:11px;color:#46678e}.empty{padding:24px 15px;text-align:center;line-height:1.6;color:var(--muted)}#notice,#health{font-size:12px;line-height:1.5;color:#9c4c17;background:#fff3df;margin:8px 12px;padding:10px;border-radius:8px}#notice:empty,#health:empty{display:none}#selected{display:none;position:fixed;z-index:1500;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:620px;max-height:46dvh;overflow:auto;background:#fffffff7;backdrop-filter:blur(12px);border:1px solid #8fa9d1;border-radius:16px;padding:16px;box-shadow:0 -10px 50px #142c4840}#selected.visible{display:block}.selected-top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-16px;background:#fff;padding:5px 0}#selected h2{color:#172b45}#selected button{min-width:44px}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}.details b{display:block;font-size:13px;margin-top:4px}.details small{font-size:10px}.googleflight{display:block;text-align:center;padding:12px 16px;min-height:44px;margin-top:16px;background:#2563eb;color:#fff;border-radius:9px;text-decoration:none;font-weight:650}.googleflight:hover{background:#1d4ed8}body:has(#selected.visible){padding-bottom:45dvh}footer{text-align:center;font-size:10px;line-height:1.7;color:var(--muted);padding:20px 14px}[hidden]{display:none!important}@media(max-width:360px){.controls{margin:10px 8px}.readout{min-width:63px}.listhead h2{font-size:17px}.chip{font-size:9px}.details{gap:9px}.flight{padding:12px}}@media(orientation:landscape) and (max-height:550px){#map{height:80svh;min-height:260px}}
</style></head><body><div hidden aria-hidden="true"><span id="status"></span><span id="age"></span><span id="locationstatus">Standort wird ermittelt …</span></div><main><div class="mapwrap"><div id="map" aria-label="Karte mit Flugzeugen innerhalb von 20 NM um deinen Standort"></div><div id="maperror" class="maperror" hidden></div></div><div class="controls"><button id="locate" aria-label="Zu meinem Standort">⌖</button><div class="zoomgroup"><button id="zoomout" aria-label="Herauszoomen">−</button><div class="readout"><b>20 NM</b><small>DATENUMKREIS</small></div><button id="zoomin" aria-label="Hineinzoomen">+</button></div><button id="reset">⌖ 20 NM</button></div><div id="notice" role="alert"></div><div id="health" role="status"></div><div id="selected"></div>
<div class="summary"><div class="stat"><b id="total">0</b><small>Im Umkreis</small></div><div class="stat"><b id="nearest">—</b><small>Nächstes Flugzeug</small></div></div>
<div class="listhead"><h2>Flugzeuge</h2><span class="chip">20 NM · nächste zuerst</span></div><div id="list" class="list"><div class="empty">Standort wird ermittelt …</div></div>
<footer><a href="" target="_blank" rel="noopener">Daten</a> · ca. alle 10 s · V7<br>Standort gerundet</footer></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
'use strict';
const $=id=>document.getElementById(id),BASE=20;
let HOME=null,locationReady=false,fixTime=0,accuracy=0,watchId=null;
const endpoint='https://script.google.com/macros/s/AKfycbyHtG7ZE6aD2TCNjTiHlloe-WxmTSRbYeMdWV13v7BcWn39VxTAIy3FKa0zpYIlNlXaAg/exec';
let aircraft=[],selected=null,busy=false,failed=false,updated=0,sourceTime=0,nextAttempt=0,sequence=0;
let map=null,planeLayer=null,homeMarker=null,rangeCircle=null,mapPositioned=false;const markers=new Map();
const num=x=>typeof x==='number'&&Number.isFinite(x),ground=a=>a.alt_baro==='ground',label=a=>a.flight?.trim()||a.r||a.hex,fmt=(v,u='')=>num(v)?Math.round(v).toLocaleString('de-CH')+u:'—',esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function relative(a){const rad=Math.PI/180,p1=HOME[0]*rad,p2=a.lat*rad,dl=(a.lon-HOME[1])*rad,dp=p2-p1,h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2,d=3440.065*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h)),bearing=(Math.atan2(Math.sin(dl)*Math.cos(p2),Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl))*180/Math.PI+360)%360;return {distance:d,bearing,east:d*Math.sin(bearing*rad),north:d*Math.cos(bearing*rad)}}
function nearby(){if(!HOME)return [];return aircraft.filter(a=>!ground(a)&&relative(a).distance<=BASE).sort((a,b)=>relative(a).distance-relative(b).distance)}
function initMap(){
 if(!window.L){$('notice').textContent='Die Kartenbibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen. Die Flugzeugliste bleibt verfügbar.';return}
 map=L.map('map',{zoomControl:false,attributionControl:true}).setView([47.4581,8.5555],9);
 L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxNativeZoom:17,maxZoom:19,attribution:'Kartendaten: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, SRTM | &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA</a>)'}).on('tileerror',()=>{$('maperror').textContent='Kartenhintergrund nicht erreichbar';$('maperror').hidden=false}).on('load',()=>{$('maperror').hidden=true}).addTo(map);
 planeLayer=L.layerGroup().addTo(map);map.on('zoomend',renderMap);
 if(window.ResizeObserver)new ResizeObserver(()=>map.invalidateSize()).observe($('map'));
}
function fitArea(){if(map&&HOME&&rangeCircle){mapPositioned=true;map.fitBounds(rangeCircle.getBounds(),{padding:[18,18]})}}
function renderMap(){
 if(!map||!planeLayer)return;
 const data=nearby(),visibleIds=new Set(data.map(a=>a.hex));
 for(const [hex,marker]of markers)if(!visibleIds.has(hex)){planeLayer.removeLayer(marker);markers.delete(hex)}
 if(!HOME){if(homeMarker){map.removeLayer(homeMarker);homeMarker=null}if(rangeCircle){map.removeLayer(rangeCircle);rangeCircle=null}mapPositioned=false;return}
 if(!homeMarker)homeMarker=L.circleMarker(HOME,{radius:7,color:'#ffffff',weight:3,fillColor:'#2563eb',fillOpacity:1}).addTo(map).bindTooltip('Dein Standort');else homeMarker.setLatLng(HOME);
 if(!rangeCircle)rangeCircle=L.circle(HOME,{radius:BASE*1852,color:'#416eac',weight:1.2,dashArray:'6 8',fill:false,opacity:.6,interactive:false}).addTo(map);else rangeCircle.setLatLng(HOME);
 if(!mapPositioned)fitArea();
 for(const a of data){
  const active=selected===a.hex,rotation=num(a.track)?a.track:0;
  const icon=L.divIcon({className:'aircraft-icon'+(active?' active':''),iconSize:[38,38],iconAnchor:[19,19],html:'<svg width="38" height="38" viewBox="0 0 24 24" style="transform:rotate('+rotation+'deg)"><path fill="'+(active?'#fb7b25':'#ffdf3d')+'" stroke="#172b45" stroke-width="1.5" stroke-linejoin="round" paint-order="stroke fill" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>'});
  let marker=markers.get(a.hex);
  if(!marker){marker=L.marker([a.lat,a.lon],{icon,title:label(a),keyboard:true}).on('click',()=>choose(a.hex)).addTo(planeLayer);markers.set(a.hex,marker)}else marker.setLatLng([a.lat,a.lon]).setIcon(icon);
  marker.setZIndexOffset(active?10000:0);marker.unbindTooltip();marker.bindTooltip(esc(label(a)),{permanent:active||map.getZoom()>=11||data.length<=10,direction:'right',offset:[15,0],className:'flight-label'});
 }
}
function choose(hex){selected=hex;render();const a=aircraft.find(a=>a.hex===hex);if(map&&a)map.panTo([a.lat,a.lon])}
function googleFlightURL(a){const callsign=String(a.flight||'').trim();const query=callsign?callsign+' flight route':a.r?String(a.r)+' aircraft':String(a.hex)+' aircraft';return 'https://www.google.com/search?q='+encodeURIComponent(query)}
function render(){const data=nearby();$('total').textContent=data.length;$('nearest').textContent=data.length?relative(data[0]).distance.toFixed(1)+' NM':'—';renderMap();$('list').replaceChildren();for(const a of data){const b=document.createElement('button');b.className='flight'+(selected===a.hex?' selected':'')+(ground(a)?' ground':'');const p=relative(a),rate=a.baro_rate??a.geom_rate,state=ground(a)?'Am Boden':num(rate)&&rate>200?'↗ Steigend':num(rate)&&rate< -200?'↘ Sinkend':'In der Luft';b.innerHTML='<div class="flight-top"><strong>'+esc(label(a))+'</strong><span class="dist">'+p.distance.toFixed(1)+' NM ⌖</span></div><div class="flight-sub">'+esc(a.r)+' · '+esc(a.t)+'</div><div class="flight-bottom"><span>'+(ground(a)?'Boden':fmt(a.alt_baro,' ft'))+'</span><span>'+fmt(a.gs,' kt')+'</span><span class="state">'+state+'</span></div>';b.onclick=()=>choose(a.hex);$('list').append(b)}if(!data.length)$('list').innerHTML='<div class="empty">'+(updated?'Keine empfangenen Flugzeuge innerhalb von 20 NM.':'Noch keine Daten. Bitte Verbindung prüfen.')+'</div>';const a=data.find(a=>a.hex===selected);$('selected').classList.toggle('visible',!!a);if(a){$('selected').innerHTML='<div class="selected-top"><div><h2>'+esc(label(a))+'</h2><small>'+esc(a.r)+' · '+esc(a.t)+'</small></div><button id="deselect" aria-label="Auswahl aufheben">×</button></div><div class="details">'+[['Höhe',ground(a)?'Am Boden':fmt(a.alt_baro,' ft')],['Geschwindigkeit',fmt(a.gs,' kt')],['Distanz',relative(a).distance.toFixed(1)+' NM'],['Kurs',fmt(a.track,'°')],['Steigen / Sinken',fmt(a.baro_rate??a.geom_rate,' ft/min')],['Squawk',esc(a.squawk)]].map(x=>'<div><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join('')+'</div><a class="googleflight" href="'+esc(googleFlightURL(a))+'" target="_blank" rel="noopener noreferrer">↗ '+(String(a.flight||'').trim()?'Flugroute auf Google':'Flugzeug auf Google')+'</a><small style="display:block;margin-top:12px">ICAO '+esc(a.hex)+' · Positionsalter beim Abruf '+fmt(a.seen_pos,' s')+'</small>';$('deselect').onclick=()=>{selected=null;render()}}else selected=null}
function requestGoogle(center){return new Promise((resolve,reject)=>{const cb='lszh_cb_'+Date.now()+'_'+(++sequence),script=document.createElement('script');let timeout;const clean=()=>{clearTimeout(timeout);script.remove();delete window[cb]};window[cb]=data=>{clean();resolve(data)};script.onerror=()=>{clean();reject(Error('Web-App nicht erreichbar. Zugriff »Jeder« prüfen.'))};timeout=setTimeout(()=>{clean();reject(Error('Zeitüberschreitung beim Google-Abruf.'))},25000);const u=new URL(endpoint);u.searchParams.set('lat',center[0].toFixed(3));u.searchParams.set('lon',center[1].toFixed(3));u.searchParams.set('callback',cb);u.searchParams.set('_',Date.now());script.src=u.href;script.referrerPolicy='no-referrer';document.head.append(script)})}
async function load(){if(!endpoint||!locationReady||!HOME||Date.now()-fixTime>120000||busy||document.hidden||Date.now()<nextAttempt)return;busy=true;nextAttempt=Date.now()+10000;$('status').textContent='Positionen werden geladen …';const requestedCenter=HOME.slice();try{const j=await requestGoogle(requestedCenter);if(!j||j.ok===false)throw Error(j?.error||'Keine Flugdaten');if(j.apiVersion!==2||j.center?.mode!=='location')throw Error('Bitte den neuen Code.gs als neue Web-App-Version bereitstellen.');if(Math.abs(j.center.lat-requestedCenter[0])>.002||Math.abs(j.center.lon-requestedCenter[1])>.002)throw Error('Antwort gehört zu einem anderen Standort.');if(!Array.isArray(j.ac)||!num(j.now))throw Error('Ungültige Datenantwort');aircraft=j.ac.filter(a=>typeof a.hex==='string'&&num(a.lat)&&num(a.lon)&&Math.abs(a.lat)<=90&&Math.abs(a.lon)<=180&&(a.seen_pos??999)<60);updated=Date.now();sourceTime=j.now<1e12?j.now*1000:j.now;failed=false;$('notice').textContent='';render()}catch(error){failed=true;nextAttempt=Date.now()+60000;$('notice').textContent=error.message+' Neuer Versuch in einer Minute. '+(updated?'Letzte Momentaufnahme bleibt sichtbar.':'')}finally{busy=false;tick()}}
function tick(){const age=updated?Math.max(0,Math.floor((Date.now()-sourceTime)/1000)):0;if(!busy)$('status').textContent=!locationReady?'Standort benötigt':Date.now()-fixTime>120000?'Standort veraltet':failed?'● Verbindung unterbrochen':updated?(age>60?'● Daten veraltet':'● Positionsdaten aktiv'):'Warte auf Daten';$('status').style.color=failed||age>60?'#ffd382':'#7bffbb';$('age').textContent=updated?'Datenalter '+(age<60?age+' s':Math.floor(age/60)+' min '+age%60+' s'):'Noch keine Daten';$('health').textContent=!locationReady?$('locationstatus').textContent:Date.now()-fixTime>120000?'Standort veraltet. Mit ⌖ erneut bestimmen.':updated&&age>60?'Flugdaten veraltet · Datenalter '+Math.floor(age/60)+' min '+age%60+' s':'';if(endpoint&&!busy&&!document.hidden&&Date.now()>=nextAttempt)load()}

function locationError(error){locationReady=false;HOME=null;aircraft=[];updated=0;selected=null;render();$('locationstatus').textContent=error.code===1?'Standort nicht freigegeben. Zugriff in den Browser-Einstellungen erlauben.':error.code===3?'Standortbestimmung dauert zu lange. Unter freiem Himmel erneut versuchen.':'Standort momentan nicht verfügbar.';$('status').textContent='Standort benötigt';}
function onLocation(position){const p=position.coords;if(!num(p.latitude)||!num(p.longitude)||Math.abs(p.latitude)>90||Math.abs(p.longitude)>180)return;HOME=[p.latitude,p.longitude];fixTime=position.timestamp||Date.now();accuracy=p.accuracy;locationReady=true;$('locationstatus').textContent='Dein Standort · Genauigkeit ca. '+Math.round(accuracy)+' m';render();tick();}
function startLocation(){
 if(!endpoint)return;
 if(!window.isSecureContext){$('locationstatus').textContent='Bitte die Seite über HTTPS (z. B. GitHub Pages) öffnen.';return}
 if(!navigator.geolocation){$('locationstatus').textContent='Dieser Browser unterstützt keinen Standortzugriff.';return}
 if(watchId!==null)navigator.geolocation.clearWatch(watchId);
 $('locationstatus').textContent='Standort wird ermittelt …';
 watchId=navigator.geolocation.watchPosition(onLocation,locationError,{enableHighAccuracy:true,maximumAge:15000,timeout:20000});
}
$('locate').onclick=()=>{if(map&&HOME)map.panTo(HOME);startLocation()};

$('zoomout').onclick=()=>{if(map)map.zoomOut()};$('zoomin').onclick=()=>{if(map)map.zoomIn()};$('reset').onclick=fitArea;
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&endpoint)startLocation();tick()});initMap();startLocation();document.addEventListener('keydown',e=>{if(e.key==='Escape'&&selected){selected=null;render()}});setInterval(tick,1000);
</script></body></html>
