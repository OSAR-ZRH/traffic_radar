<main><div class="scopewrap"><div class="scope" id="scope" aria-label="Animiertes Radar um deinen Standort, auf Flugzeugpunkte tippen"><div class="sweep" id="sweep"></div><svg viewBox="20 20 560 560" id="radar" role="img" aria-label="Flugzeugpositionen relativ zu deinem Standort"><defs><clipPath id="clip"><rect x="20" y="20" width="560" height="560"/></clipPath><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter></defs><g fill="none" stroke="#5edb8e" stroke-opacity=".22"><circle cx="300" cy="300" r="258"/><circle cx="300" cy="300" r="193.5"/><circle cx="300" cy="300" r="129"/><circle cx="300" cy="300" r="64.5"/><path d="M300 42V658M42 300H558"/><path d="M117.57 117.57L482.43 482.43M117.57 482.43L482.43 117.57" stroke-dasharray="2 7"/></g><g fill="#90cba3" font-size="16" text-anchor="middle"><text x="300" y="42">N</text><text x="568" y="306">E</text><text x="300" y="574">S</text><text x="32" y="306">W</text></g><g fill="#6fbc8c" font-size="10" text-anchor="end"><text x="296" y="105" id="ring3">15</text><text x="296" y="170" id="ring2">10</text><text x="296" y="234" id="ring1">5</text></g><g clip-path="url(#clip)" id="blips"></g><circle cx="300" cy="300" r="4" fill="#dcffe5"/><text x="300" y="320" text-anchor="middle" fill="#b6e8c3" font-size="11" stroke="#071b10" stroke-width="3" paint-order="stroke fill">DU</text></svg></div></div>

<script>
'use strict';
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg',BASE=20;

let aircraft=[],selected=null,zoom=1,busy=false,failed=false,updated=0,sourceTime=0,nextAttempt=0,sequence=0,sweepAngle=0,previousFrame=0;
const blipNodes=new Map(),hits=new Map();
const num=x=>typeof x==='number'&&Number.isFinite(x),ground=a=>a.alt_baro==='ground',label=a=>a.flight?.trim()||a.r||a.hex,fmt=(v,u='')=>num(v)?Math.round(v).toLocaleString('de-CH')+u:'—',esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function svg(tag,attrs){const e=document.createElementNS(NS,tag);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);return e}
function setZoom(value){zoom=Math.max(1,Math.min(8,value));const range=BASE/zoom;$('range').textContent=range.toLocaleString('de-CH',{maximumFractionDigits:1})+' NM';for(let i=1;i<=3;i++)$('ring'+i).textContent=(range*i/4).toLocaleString('de-CH',{maximumFractionDigits:1});$('zoomout').disabled=zoom<=1;$('zoomin').disabled=zoom>=8;renderBlips()}

function choose(hex){selected=hex;const a=aircraft.find(a=>a.hex===hex);if(a){const d=relative(a).distance;if(d>BASE/zoom)setZoom(Math.max(1,BASE/(d*1.1)));hits.set(hex,performance.now())}render()}
function googleFlightURL(a){const callsign=String(a.flight||'').trim();const query=callsign?callsign+' flight route':a.r?String(a.r)+' aircraft':String(a.hex)+' aircraft';return 'https://www.google.com/search?q='+encodeURIComponent(query)}
function render(){const data=nearby();$('total').textContent=data.length;$('nearest').textContent=data.length?relative(data[0]).distance.toFixed(1)+' NM':'—';renderBlips();$('list').replaceChildren();for(const a of data){const b=document.createElement('button');b.className='flight'+(selected===a.hex?' selected':'')+(ground(a)?' ground':'');const p=relative(a),rate=a.baro_rate??a.geom_rate,state=ground(a)?'Am Boden':num(rate)&&rate>200?'↗ Steigend':num(rate)&&rate< -200?'↘ Sinkend':'In der Luft';b.innerHTML='<div class="flight-top"><strong>'+esc(label(a))+'</strong><span class="dist">'+p.distance.toFixed(1)+' NM ⌖</span></div><div class="flight-sub">'+esc(a.r)+' · '+esc(a.t)+'</div><div class="flight-bottom"><span>'+(ground(a)?'Boden':fmt(a.alt_baro,' ft'))+'</span><span>'+fmt(a.gs,' kt')+'</span><span class="state">'+state+'</span></div>';b.onclick=()=>choose(a.hex);$('list').append(b)}if(!data.length)$('list').innerHTML='<div class="empty">'+(updated?'Keine empfangenen Flugzeuge innerhalb von 20 NM.':'Noch keine Daten. Bitte Verbindung prüfen.')+'</div>';const a=data.find(a=>a.hex===selected);$('selected').classList.toggle('visible',!!a);if(a){$('selected').innerHTML='<div class="selected-top"><div><h2>'+esc(label(a))+'</h2><small>'+esc(a.r)+' · '+esc(a.t)+'</small></div><button id="deselect" aria-label="Auswahl aufheben">×</button></div><div class="details">'+[['Höhe',ground(a)?'Am Boden':fmt(a.alt_baro,' ft')],['Geschwindigkeit',fmt(a.gs,' kt')],['Distanz',relative(a).distance.toFixed(1)+' NM'],['Kurs',fmt(a.track,'°')],['Steigen / Sinken',fmt(a.baro_rate??a.geom_rate,' ft/min')],['Squawk',esc(a.squawk)]].map(x=>'<div><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join('')+'</div><a class="googleflight" href="'+esc(googleFlightURL(a))+'" target="_blank" rel="noopener noreferrer">↗ '+(String(a.flight||'').trim()?'Flugroute auf Google':'Flugzeug auf Google')+'</a><small style="display:block;margin-top:12px">ICAO '+esc(a.hex)+' · Positionsalter beim Abruf '+fmt(a.seen_pos,' s')+'</small>';$('deselect').onclick=()=>{selected=null;render()}}else selected=null;for(const key of hits.keys())if(!data.some(a=>a.hex===key))hits.delete(key)}
function animate(t){const dt=previousFrame?Math.min(t-previousFrame,200):0;previousFrame=t;if(!document.hidden){const advance=dt*360/6000;sweepAngle=(sweepAngle+advance)%360;$('sweep').style.transform='rotate('+sweepAngle+'deg)';for(const [hex,n]of blipNodes){const behind=(sweepAngle-n.bearing+360)%360;if(advance>0&&behind<=advance)hits.set(hex,t);const elapsed=t-(hits.get(hex)??-100000),pulse=Math.max(0,1-elapsed/1600),active=selected===hex;n.halo.setAttribute('opacity',active?.55:pulse*.8);n.dot.setAttribute('opacity',active?1:.45+.55*pulse);n.name.setAttribute('opacity',active?1:.5+.5*pulse);n.dot.setAttribute('r',active?5.5:3.8+1.8*pulse)}}requestAnimationFrame(animate)}
function requestGoogle(center){return new Promise((resolve,reject)=>{const cb='lszh_cb_'+Date.now()+'_'+(++sequence),script=document.createElement('script');let timeout;const clean=()=>{clearTimeout(timeout);script.remove();delete window[cb]};window[cb]=data=>{clean();resolve(data)};script.onerror=()=>{clean();reject(Error('Web-App nicht erreichbar. Zugriff »Jeder« prüfen.'))};timeout=setTimeout(()=>{clean();reject(Error('Zeitüberschreitung beim Google-Abruf.'))},25000);const u=new URL(endpoint);u.searchParams.set('lat',center[0].toFixed(3));u.searchParams.set('lon',center[1].toFixed(3));u.searchParams.set('callback',cb);u.searchParams.set('_',Date.now());script.src=u.href;script.referrerPolicy='no-referrer';document.head.append(script)})}
async function load(){if(!endpoint||!locationReady||!HOME||Date.now()-fixTime>120000||busy||document.hidden||Date.now()<nextAttempt)return;busy=true;nextAttempt=Date.now()+10000;$('status').textContent='Positionen werden geladen …';const requestedCenter=HOME.slice();try{const j=await requestGoogle(requestedCenter);if(!j||j.ok===false)throw Error(j?.error||'Keine Flugdaten');if(j.apiVersion!==2||j.center?.mode!=='location')throw Error('Bitte den neuen Code.gs als neue Web-App-Version bereitstellen.');if(Math.abs(j.center.lat-requestedCenter[0])>.002||Math.abs(j.center.lon-requestedCenter[1])>.002)throw Error('Antwort gehört zu einem anderen Standort.');if(!Array.isArray(j.ac)||!num(j.now))throw Error('Ungültige Datenantwort');aircraft=j.ac.filter(a=>typeof a.hex==='string'&&num(a.lat)&&num(a.lon)&&Math.abs(a.lat)<=90&&Math.abs(a.lon)<=180&&(a.seen_pos??999)<60);updated=Date.now();sourceTime=j.now<1e12?j.now*1000:j.now;failed=false;$('notice').textContent='';render()}catch(error){failed=true;nextAttempt=Date.now()+60000;$('notice').textContent=error.message+' Neuer Versuch in einer Minute. '+(updated?'Letzte Momentaufnahme bleibt sichtbar.':'')}finally{busy=false;tick()}}
function tick(){const age=updated?Math.max(0,Math.floor((Date.now()-sourceTime)/1000)):0;if(!busy)$('status').textContent=!locationReady?'Standort benötigt':Date.now()-fixTime>120000?'Standort veraltet':failed?'● Verbindung unterbrochen':updated?(age>60?'● Daten veraltet':'● Positionsdaten aktiv'):'Warte auf Daten';$('status').style.color=failed||age>60?'#ffd382':'#7bffbb';$('age').textContent=updated?'Datenalter '+(age<60?age+' s':Math.floor(age/60)+' min '+age%60+' s'):'Noch keine Daten';$('health').textContent=!locationReady?$('locationstatus').textContent:Date.now()-fixTime>120000?'Standort veraltet. Mit ⌖ erneut bestimmen.':updated&&age>60?'Flugdaten veraltet · Datenalter '+Math.floor(age/60)+' min '+age%60+' s':'';if(endpoint&&!busy&&!document.hidden&&Date.now()>=nextAttempt)load()}

function startLocation(){

}
$('locate').onclick=()=>startLocation();
